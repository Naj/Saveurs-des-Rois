<html lang="fr">
<head>

  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">

<body data-carte="pro">
  <div class="outils" id="outils">
    <a href="/#/pro" class="outils__retour">← Espace pro</a>
    <span class="outils__titre">Carte professionnels</span>
    <div class="outils__choix" id="choix">
      <label><input type="checkbox" data-opt="couverture" checked> Couverture</label>

      <label><input type="checkbox" data-opt="fiches" checked> Une page par pâtisserie</label>

    <button class="b b--or" id="imprimer" type="button">Télécharger en PDF</button>
    <p class="outils__aide">Vos tarifs professionnels au kilo et pour 100 g, toujours à jour. « Télécharger en PDF » ouvre l’impression : choisissez <strong>Enregistrer au format PDF</strong>.</p>

  <main id="carte"><p class="chargement">Chargement de la carte…</p></main>
