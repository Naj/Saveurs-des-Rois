<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Devis — Saveurs des Rois</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/devis.css?v=2.8">
</head>
<body>
  <div class="barre" id="barre">
    <a href="/admin/" class="barre__retour">← Administration</a>
    <span class="barre__etat" id="etat"></span>
    <div class="barre__actions">
      <button class="b b--ligne" id="ajoutPart" type="button">+ Ligne particulier</button>
      <button class="b b--ligne" id="ajoutPro" type="button">+ Ligne pro</button>
      <button class="b b--ligne" id="ajoutFrais" type="button">+ Livraison / frais</button>
      <button class="b b--ligne" id="enregistrer" type="button">Enregistrer</button>
      <button class="b b--or" id="pdf" type="button">Télécharger en PDF</button>
    </div>
    <p class="barre__aide">Tout est modifiable : cliquez sur un texte, une quantité ou un prix (les prix de la grille dégressive sont appliqués automatiquement). « Télécharger en PDF » ouvre l’impression : choisissez <strong>Enregistrer au format PDF</strong>.</p>
  </div>

  <main id="doc" class="feuille" aria-live="polite"><p class="chargement">Chargement du devis…</p></main>

  <div class="barre barre--bas" id="envoi" hidden></div>
  <script src="/admin/devis.js?v=2.8" type="module"></script>
</body>
</html>
